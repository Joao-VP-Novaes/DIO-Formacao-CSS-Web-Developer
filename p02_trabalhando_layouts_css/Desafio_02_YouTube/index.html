<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body style="height: 100em;"> <!-- remover iso depois !!!!!!!!!!!!!!!!!!!!!!!! -->
    <header>
        <div id="container1">
            <img src="./imgs/burger-menu.svg" alt="menu de hamburguer">
            <img src="./imgs/youtubeLogo.png" alt="Logo do YouTube">
        </div>

        <div id="container2">
            <div>
                <img src="./imgs/magnifyingGlass.png" alt="Ícone de busca">
            </div>
        </div>

        <div id="container3">
            <img src="./imgs/camera.png" alt="importar vídeo">
            <img src="./imgs/church_bell_icon.png" alt="sininho">
            <img id="fotoPerfil" src="./imgs/profilePic.png" alt="foto de perfil">
        </div>
    </header>

    <main>
        <section id="video">
            <iframe width="100%" height="520" src="https://www.youtube.com/embed/RITyvTLQtjE?si=DbrjP6mhuuVcsE_M"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            <p class="negrito">Semana Front-end | Dia 01: Construindo uma Landing Page no Mundo Invertido com HTML e CSS
            </p>

            <div class="actions">
                <div class="channel">
                    <img src="./imgs/logoDIO.jpg" alt="Foto de perfil do canal">

                    <div style="font-weight: 700;">DIO</div>
                    <div style="opacity: 70%;">83.3 mil inscritos</div>
                </div>

                <button>Inscreva-se</button>

                <div class="interagir">
                    <img src="./imgs/like.png" alt="botão de curtir">

                    <p>2 mil</p>
                </div>

                <div class="interagir">
                    <img src="./imgs/dislike.png" alt="botão de descurtir">

                    <p>Não gostei</p>
                </div>

                <div class="interagir">
                    <img src="./imgs/enviar.png" alt="botão de compartilhar">

                    <p>Compartilhar</p>
                </div>

                <div class="interagir">
                    <img src="./imgs/download.png" alt="botão de baixar" style="mix-blend-mode:color-burn; background-color: transparent;">

                    <p>Download</p>
                </div>
            </div>
        </section>

        <section id="outrosVideos">

        </section>
    </main>
</body>

</html>
