<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo de grid-template</title>
<style>
  body {
    font-family: sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    display: grid;
    grid-template:
      "sidebar header" 60px
      "sidebar main" 200px
      "sidebar footer" 50px
      / 150px 350px;
    gap: 6px;
    width: max-content;
  }

  .item {
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    border-radius: 6px;
  }

  .header  { grid-area: header;  background-color: #3498db; }
  .sidebar { grid-area: sidebar; background-color: #9b59b6; }
  .main    { grid-area: main;    background-color: #2ecc71; }
  .footer  { grid-area: footer;  background-color: #e74c3c; }
</style>
</head>
<body>

<div class="container">
  <div class="item header">Header</div>
  <div class="item sidebar">Sidebar</div>
  <div class="item main">Main</div>
  <div class="item footer">Footer</div>
</div>

</body>
</html>
