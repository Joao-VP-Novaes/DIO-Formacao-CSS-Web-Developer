<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBO Max/login</title>

    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="./assets/images/hbo-logo.svg" alt="HBO Logo">
        </a>

        <nav>
            <a class="nav__botao" href="#">ENTRAR</a>
            <a href="./index.html#sectionPlanos" class="nav__botao nav__botao--fundo">ASSINE AGORA</a>
        </nav>
    </header>

    <main class="red">
        <div class="containerForm">
            <h4>ENTRAR</h4>

            <p>Você tem uma conta HBO Max?</p>

            <form action="#" method="post">
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="8" required>
    
                <div class="form__containerBotoes">
                    <button class="form__botao form__botao--BG">Entrar</button>
                    <button class="form__botao form__botao--senha"> Esqueceu a senha?</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <section class="footer__links">
            <a href="#">AGORA NA HBO MAX</a>
            <a href="#">EM BREVE</a>
            <a href="#">FILME EM DESTAQUE</a>
            <a href="#">SÉRIES</a>
            <a href="#">AJUDA</a>
        </section>

        <small>
            © 2022 WarnerMedia. Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.
        </small>

        <section class="footer__redes">
            <a href="https://www.facebook.com/HBOMaxBrasil/?locale=pt_BR" target="_blank">
                <img src="./assets/images/fb_0.png" alt="link do Facebook da HBO Max">
            </a>
            <a href="https://x.com/StreamMaxBR" target="_blank">
                <img src="./assets/images/twitter_0.png" alt="link do Twitter da HBO Max">
            </a>
            <a href="https://www.instagram.com/hbomaxbrasil/" target="_blank">
                <img src="./assets/images/instagram_0.png" alt="link do Instagram da HBO Max">
            </a>
            <a href="https://www.youtube.com/@hbomax" target="_blank">
                <img src="./assets/images/youtube_0.png" alt="link do YouTube da HBO Max">
            </a>
        </section>
    </footer>
</body>
</html>
