<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="./assets/images/hbo-logo.svg" alt="HBO Logo">

        <nav>
            <button class="nav__botao">ENTRAR</button>
            <button class="nav__botao nav__botao--fundo">ASSINE AGORA</button>
        </nav>
    </header>

    <main>
        <section class="intro">
            <div class="intro__imagens">
                <img src="./assets/images/hbo.png" alt="HBO imagem">
                <img src="./assets/images/dc.png" alt="DC imagem">
                <img src="./assets/images/warner_bros_logoMini.png" alt="Warner Bros imagem">
                <img src="./assets/images/cartoon-network_neutral.png" alt="Cartoon Network imagem">
                <img src="./assets/images/max_originals.png" alt="Max Originals imagem">
            </div>

            <p class="intro__slogan">CURTA AS MELHORES HISTÓRIAS<br><span class="intro__slogan--negrito">PARA TODO O MUNDO</span></p>

            <hr>

            <p class="intro__textoSimples">Assinaturas a partir de</p>
            <p class="intro_infoPreco"><span class="intro__preco">R$14,15</span> <span class="intro__microTexto">/mês*</span></p>

            <button class="intro__botaoAnimado">ASSINE AGORA</button>

            <p class="intro__microTexto">*aplicável ao plano anual com o<br>pagamento antecipado.</p>
        </section>
    </main>
</body>
</html>
